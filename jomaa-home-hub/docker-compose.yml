# Two services on the host network. Matter finds and talks to devices over the
# local network (mDNS, IPv6), which doesn't work through Docker's bridge.
services:
  matter-server:
    # Open Home Foundation Matter server. Owns pairing and the Matter fabric.
    image: ghcr.io/matter-js/matterjs-server:stable
    container_name: jomaa-matter-server
    read_only: true
    network_mode: host
    restart: unless-stopped
    environment:
      # Only the hub, on the same machine, may talk to it.
      LISTEN_ADDRESS: 127.0.0.1
      # Bluetooth pairing for brand-new Wi-Fi/Thread devices: uncomment these
      # and the dbus volume below. Without it, pair with networkOnly.
      # BLUETOOTH_ADAPTER: "0"
      # NOBLE_BINDINGS: dbus
    volumes:
      # Matter fabric keys live here. Back it up; losing it means re-pairing.
      - ./data/matter:/data
      # - /run/dbus:/run/dbus:ro

  hub:
    build: .
    container_name: jomaa-home-hub
    network_mode: host
    restart: unless-stopped
    depends_on: [matter-server]
    environment:
      HUB_PASSWORD: ${HUB_PASSWORD:?set HUB_PASSWORD in .env}
      GOVEE_API_KEY: ${GOVEE_API_KEY:-}
    volumes:
      - ./config.json:/etc/jomaa-home-hub/config.json:ro

  cloudflared:
    # Cloudflare Tunnel: serves the hub at the hostname in cloudflare.json
    # without opening router ports. Started by scripts/cloudflare.py run,
    # which supplies the tunnel token; only the hub is exposed, never the
    # Matter server.
    image: cloudflare/cloudflared:2026.10.7
    container_name: jomaa-cloudflared
    profiles: [tunnel]
    network_mode: host
    restart: unless-stopped
    depends_on: [hub]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

