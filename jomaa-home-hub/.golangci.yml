# Strict lint for the hub. Run with scripts/verify.py, or: golangci-lint run
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # correctness
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errorlint
    - nilerr
    - nilnil
    - bodyclose
    - noctx
    - contextcheck
    - durationcheck
    - makezero
    - exhaustive
    - forcetypeassert
    - copyloopvar
    - wastedassign
    - gosec
    - sloglint
    # clarity
    - revive
    - gocritic
    - unconvert
    - unparam
    - misspell
    - predeclared
    - usestdlibvars
    - intrange
    - dupword
    - errname
    - nolintlint
    - thelper
    - gocognit
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # struct layout for memory; not worth the churn here
    staticcheck:
      checks: ["all"]
    errcheck:
      check-type-assertions: true
      check-blank: false
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags: [diagnostic, style, performance]
      disabled-checks:
        - hugeParam # small value structs passed by value on purpose
        - unnamedResult
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: receiver-naming
        - name: increment-decrement
        - name: indent-error-flow
        - name: superfluous-else
        - name: unreachable-code
        - name: unused-parameter
        - name: context-as-argument
        - name: context-keys-type
        - name: early-return
    gocognit:
      min-complexity: 30
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      kv-only: true
  exclusions:
    rules:
      # Tests assert on decoded JSON shapes; a wrong shape panics the test,
      # which is the failure we want.
      - path: _test\.go
        linters: [forcetypeassert, gosec, errcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/daniel-j-meta/jomaa-everything

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
