name: DevicePanel
options:
  bundleIdPrefix: com.jomaa
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  DevicePanel:
    type: application
    platform: iOS
    sources: DevicePanel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jomaa.DevicePanel
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Device Panel
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: DevicePanel/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
        NSLocalNetworkUsageDescription: Connect to your home hub to control lights and pair Matter devices.
  DevicePanelTests:
    type: bundle.unit-test
    platform: iOS
    sources: DevicePanelTests
    dependencies:
      - target: DevicePanel
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  DevicePanelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: DevicePanelUITests
    dependencies:
      - target: DevicePanel
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DevicePanel:
    build:
      targets:
        DevicePanel: all
    test:
      targets:
        - DevicePanelTests
        - DevicePanelUITests
